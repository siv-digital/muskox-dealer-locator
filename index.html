<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Dealer</title>

<!-- Google Fonts (matching muskoxmn.com) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root {
    --color-bg: #f5f5f0;
    --color-surface: #ffffff;
    --color-primary: #1a1a1a;
    --color-accent: #ffff00;
    --color-accent-hover: #e6e600;
    --color-accent-text: #1a1a1a;
    --color-link: #1a1a1a;
    --color-muted: #6b6b6b;
    --color-border: #e2e2dd;
    --color-highlight: #fffde6;
    --radius: 10px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    --font: 'Open Sans', Arial, Helvetica, sans-serif;
    --font-heading: 'Roboto', Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-primary);
    -webkit-font-smoothing: antialiased;
  }

  .locator-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Search Bar */
  .search-section {
    margin-bottom: 20px;
  }

  .search-bar {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .search-input-wrapper {
    flex: 1;
    position: relative;
  }

  .search-input-wrapper svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--color-muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 14px 16px 14px 42px;
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 15px;
    background: var(--color-surface);
    color: var(--color-primary);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .search-input::placeholder { color: #aaa; }

  .search-input:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(255, 255, 0, 0.25);
  }

  .search-btn {
    padding: 14px 28px;
    background: var(--color-accent);
    color: var(--color-accent-text);
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-heading);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .search-btn:hover { background: var(--color-accent-hover); }
  .search-btn:active { transform: scale(0.98); }

  .radius-select {
    padding: 14px 16px;
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 15px;
    background: var(--color-surface);
    color: var(--color-primary);
    cursor: pointer;
    outline: none;
    appearance: auto;
  }

  .search-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--color-muted);
  }

  .reset-btn {
    background: none;
    border: none;
    color: var(--color-link);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .reset-btn:hover { color: var(--color-muted); }

  /* Layout: sidebar + map */
  .locator-body {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    height: 600px;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }

  /* Dealer list sidebar */
  .dealer-list {
    background: var(--color-surface);
    overflow-y: auto;
    border-right: 1px solid var(--color-border);
  }

  .dealer-list::-webkit-scrollbar { width: 6px; }
  .dealer-list::-webkit-scrollbar-track { background: transparent; }
  .dealer-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  .dealer-card {
    padding: 18px 20px;
    border-bottom: 1px solid var(--color-border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .dealer-card:hover { background: var(--color-highlight); }

  .dealer-card.active {
    background: var(--color-highlight);
    border-left: 3px solid var(--color-accent);
    padding-left: 17px;
  }

  .dealer-name {
    font-family: var(--font-heading);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--color-primary);
    line-height: 1.3;
  }

  .dealer-address {
    font-size: 13px;
    color: var(--color-muted);
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .dealer-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #f0f0eb;
    color: var(--color-muted);
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }

  .dealer-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .dealer-meta a, .dealer-meta span {
    font-size: 12.5px;
    color: var(--color-link);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
  }

  .dealer-meta a:hover { text-decoration: underline; }

  .dealer-distance {
    font-size: 12px;
    color: var(--color-muted);
    font-weight: 500;
    background: #f0f0eb;
    padding: 2px 8px;
    border-radius: 20px;
    position: absolute;
    top: 18px;
    right: 16px;
  }

  /* Map */
  .map-container {
    width: 100%;
    height: 100%;
    background: #e8e8e3;
    position: relative;
  }

  #map { width: 100%; height: 100%; }

  /* Loading state */
  .loading-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    flex-direction: column;
    gap: 12px;
    color: var(--color-muted);
    font-size: 14px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--color-border);
    border-top-color: var(--color-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty state */
  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--color-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .empty-state svg {
    width: 40px;
    height: 40px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  /* Tablet responsive (≤1024px) */
  @media (max-width: 1024px) {
    .locator-body {
      grid-template-columns: 320px 1fr;
    }

    .dealer-card {
      padding: 14px 16px;
    }

    .dealer-name {
      font-size: 14px;
    }
  }

  /* Small tablet / large phone (≤768px) */
  @media (max-width: 768px) {
    .locator-wrapper {
      padding: 16px 12px;
    }

    .locator-body {
      grid-template-columns: 1fr;
      height: auto;
    }

    .map-container {
      height: 300px;
      order: -1;
    }

    .dealer-list {
      max-height: 400px;
      border-right: none;
      border-top: 1px solid var(--color-border);
    }

    .search-bar {
      flex-wrap: wrap;
    }

    .search-input {
      font-size: 16px; /* prevents iOS zoom on focus */
    }

    .radius-select {
      flex: 1;
      min-width: 0;
      font-size: 16px;
    }

    .search-btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
    }

    .dealer-distance {
      position: static;
      margin-top: 6px;
      display: inline-block;
    }
  }

  /* Smartphone (≤480px) */
  @media (max-width: 480px) {
    .locator-wrapper {
      padding: 12px 8px;
    }

    .search-bar {
      gap: 8px;
    }

    .search-input {
      padding: 12px 14px 12px 38px;
    }

    .search-input-wrapper svg {
      left: 12px;
      width: 16px;
      height: 16px;
    }

    .radius-select {
      padding: 12px 10px;
    }

    .search-btn {
      padding: 12px 16px;
    }

    .map-container {
      height: 250px;
    }

    .dealer-list {
      max-height: 350px;
    }

    .dealer-card {
      padding: 14px 12px;
    }

    .dealer-card.active {
      padding-left: 9px;
    }

    .dealer-name {
      font-size: 14px;
    }

    .dealer-address {
      font-size: 12px;
    }

    .dealer-meta {
      gap: 12px;
    }

    .dealer-meta a, .dealer-meta span {
      font-size: 12px;
    }

    .dealer-tag {
      font-size: 9px;
      padding: 2px 6px;
    }

    .search-meta {
      font-size: 12px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .leaflet-popup-content {
      min-width: 160px !important;
      margin: 10px 12px !important;
    }

    .iw-content h3 {
      font-size: 14px;
    }

    .iw-content p, .iw-content a {
      font-size: 12px;
    }
  }

  /* Leaflet popup styling */
  .leaflet-popup-content-wrapper {
    font-family: var(--font) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
  }

  .leaflet-popup-content {
    margin: 12px 16px !important;
    min-width: 200px;
  }

  .iw-content h3 {
    font-family: var(--font-heading);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--color-primary);
  }

  .iw-content p {
    font-size: 13px;
    color: var(--color-muted);
    line-height: 1.5;
    margin-bottom: 4px;
  }

  .iw-content a {
    font-size: 13px;
    color: var(--color-link);
    text-decoration: none;
    font-weight: 600;
  }

  .iw-content a:hover { text-decoration: underline; }
</style>

          current += ch;
        }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === ',') {
          lines.push(current); current = '';
        }
        else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) {
          lines.push(current); current = '';
          if (ch === '\r') i++;
          lines.push('\n');
        }
        else { current += ch; }
      }
    }
    lines.push(current);

    const rows = [[]];
    for (const item of lines) {
      if (item === '\n') rows.push([]);
      else rows[rows.length - 1].push(item.trim());
    }

    return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
  }

  function csvToObjects(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) return [];
    const headers = rows[0];
    return rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = row[i] || ''; });
      return obj;
    });
  }

  // ── Geocoding via OpenStreetMap Nominatim (free) ───────────────────
  async function geocodeAddress(address) {
    // Detect if the query is just a zip/postal code (all digits, 5 or 5+4 format)
    const isZipOnly = /^\d{5}(-\d{4})?$/.test(address.trim());

    // Build query — bias toward US/Canada for zip codes
    let query = address;
    if (isZipOnly) {
      query = address.trim() + ', United States';
    }

    // Try with country bias first (US/Canada), then fallback without
    const countryBias = 'us,ca';

    try {
      // First attempt: with country codes to prefer North American results
      let url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=${countryBias}&q=${encodeURIComponent(query)}`;
      let resp = await fetch(url, {
        headers: { 'User-Agent': 'DealerLocatorWidget/1.0' }
      });
      let data = await resp.json();

      if (data && data[0]) {
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      }

      // Fallback: search without country restriction (for Canadian postal codes, etc.)
      if (!isZipOnly) {
        url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
        resp = await fetch(url, {
          headers: { 'User-Agent': 'DealerLocatorWidget/1.0' }
        });
        data = await resp.json();
        if (data && data[0]) {
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        }
      }
    } catch (e) {
      console.warn('Geocode failed for:', address);
    }
    return null;
  }

  // ── Data Loading ────────────────────────────────────────────────────
  async function loadDealers() {
    try {
      // Load CSV data and pre-geocoded coords in parallel
      const [csvResp, coordsResp] = await Promise.all([
        fetch(CONFIG.SHEET_CSV_URL),
        CONFIG.COORDS_JSON_URL ? fetch(CONFIG.COORDS_JSON_URL).catch(() => null) : Promise.resolve(null),
      ]);

      if (!csvResp.ok) throw new Error('Failed to load spreadsheet');
      const text = await csvResp.text();
      const raw = csvToObjects(text);

      // Load pre-geocoded coordinates if available
      let coordCache = {};
      if (coordsResp && coordsResp.ok) {
        try { coordCache = await coordsResp.json(); } catch(e) {}
      } else if (typeof DEALER_COORDS !== 'undefined') {
        coordCache = DEALER_COORDS;
      }

      allDealers = raw.map((row, i) => {
        const c = CONFIG.COLUMNS;
        const dealer = {
          id: i,
          name: row[c.name] || 'Unknown',
          tags: c.tags ? (row[c.tags] || '') : '',
          address: row[c.address] || '',
          city: row[c.city] || '',
          state: row[c.state] || '',
          zip: row[c.zip] || '',
          country: row[c.country] || '',
          phone: c.phone ? (row[c.phone] || '') : '',
          website: c.website ? (row[c.website] || '') : '',
          email: c.email ? (row[c.email] || '') : '',
          lat: c.lat ? parseFloat(row[c.lat]) : null,
          lng: c.lng ? parseFloat(row[c.lng]) : null,
        };
        dealer.fullAddress = [dealer.address, dealer.city, dealer.state, dealer.zip, dealer.country]
          .filter(Boolean).join(', ');
        dealer.cityState = [dealer.city, dealer.state].filter(Boolean).join(', ');

        // Apply cached coordinates (keyed by row index)
        if ((!dealer.lat || !dealer.lng) && coordCache[String(i)]) {
          dealer.lat = coordCache[String(i)].lat;
          dealer.lng = coordCache[String(i)].lng;
        }

        return dealer;
      }).filter(d => d.name && d.name !== 'Unknown');

      // Auto-geocode dealers missing coordinates (e.g. newly added to sheet)
      const needsGeocode = allDealers.filter(d => (!d.lat || !d.lng || isNaN(d.lat) || isNaN(d.lng)) && d.fullAddress);
      for (const dealer of needsGeocode) {
        const result = await geocodeAddress(dealer.fullAddress);
        if (result) {
          dealer.lat = result.lat;
          dealer.lng = result.lng;
          console.log(`Auto-geocoded: ${dealer.name} (${dealer.cityState}) → ${result.lat}, ${result.lng}`);
        } else {
          console.warn(`Could not geocode: ${dealer.name} (${dealer.fullAddress})`);
        }
        // Nominatim rate limit: 1 request/sec
        if (needsGeocode.indexOf(dealer) < needsGeocode.length - 1) {
          await new Promise(r => setTimeout(r, 1100));
        }
      }

      // Sort alphabetically by dealer name
      allDealers.sort((a, b) => a.name.localeCompare(b.name));

      filteredDealers = [...allDealers];
      renderList(filteredDealers);
      placeMarkers(filteredDealers);
      fitBounds(filteredDealers);

    } catch (err) {
      console.error('Error loading dealers:', err);
      document.getElementById('dealerList').innerHTML = `
        <div class="empty-state">
          <p><strong>Unable to load dealer data.</strong></p>
          <p>Make sure the Google Sheet is published to the web as CSV.<br>
          File &rarr; Share &rarr; Publish to web &rarr; CSV</p>
        </div>`;
    }
  }

  // ── Map Markers ─────────────────────────────────────────────────────
  function clearMarkers() {
    if (markerGroup) {
      markerGroup.clearLayers();
    }
    markers = [];
  }

  function placeMarkers(dealers) {
    clearMarkers();
    const icon = createMarkerIcon(CONFIG.MARKER_COLOR);

    dealers.forEach((dealer, idx) => {
      if (!dealer.lat || !dealer.lng || isNaN(dealer.lat) || isNaN(dealer.lng)) return;

      const marker = L.marker([dealer.lat, dealer.lng], { icon: icon });

      const popupContent = buildPopupContent(dealer);
      marker.bindPopup(popupContent, { maxWidth: 280 });

      marker.on('click', () => {
        highlightCard(idx);
      });

      markerGroup.addLayer(marker);
      markers.push(marker);
    });
  }

  function buildPopupContent(dealer) {
    const phone = dealer.phone ? `<p>&#x1F4DE; <a href="tel:${dealer.phone}">${dealer.phone}</a></p>` : '';
    const website = dealer.website ? `<p>&#x1F310; <a href="${dealer.website.startsWith('http') ? dealer.website : 'https://' + dealer.website}" target="_blank" rel="noopener">Visit Website</a></p>` : '';
    const directions = `<p>&#x1F4CD; <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dealer.fullAddress)}" target="_blank" rel="noopener">Get Directions</a></p>`;

    return `
      <div class="iw-content">
        <h3>${dealer.name}</h3>
        <p>${dealer.address}<br>${dealer.cityState}${dealer.zip ? ' ' + dealer.zip : ''}</p>
        ${phone}${website}${directions}
      </div>
    `;
  }

  function fitBounds(dealers) {
    const valid = dealers.filter(d => d.lat && d.lng && !isNaN(d.lat) && !isNaN(d.lng));
    if (!valid.length) {
      map.setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);
      return;
    }
    if (valid.length === 1) {
      map.setView([valid[0].lat, valid[0].lng], 10);
      return;
    }
    const bounds = L.latLngBounds(valid.map(d => [d.lat, d.lng]));
    map.fitBounds(bounds, { padding: [40, 40] });
  }

  // ── Dealer List Rendering ───────────────────────────────────────────
  function renderList(dealers) {
    const list = document.getElementById('dealerList');
    document.getElementById('loadingState')?.remove();

    if (!dealers.length) {
      list.innerHTML = `
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
          <p>No dealers found in this area.<br>Try expanding your search radius.</p>
        </div>`;
      return;
    }

    list.innerHTML = dealers.map((d, i) => {
      const distLabel = d._distance != null ? `${d._distance.toFixed(0)} mi` : '';
      const phone = d.phone ? `<a href="tel:${d.phone}">&#x1F4DE; ${d.phone}</a>` : '';
      const website = d.website ? `<a href="${d.website.startsWith('http') ? d.website : 'https://' + d.website}" target="_blank" rel="noopener">&#x1F310; Website</a>` : '';
      const directions = `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(d.fullAddress)}" target="_blank" rel="noopener">&#x1F4CD; Directions</a>`;

      const tag = d.tags ? `<span class="dealer-tag">${d.tags}</span>` : '';

      return `
        <div class="dealer-card" data-index="${i}" onclick="window.__locator.selectDealer(${i})">
          <div class="dealer-name">${d.name}</div>
          ${tag}
          <div class="dealer-address">${d.address}<br>${d.cityState}${d.zip ? ' ' + d.zip : ''}</div>
          <div class="dealer-meta">
            ${phone}${website}${directions}
          </div>
          ${distLabel ? `<span class="dealer-distance">${distLabel}</span>` : ''}
        </div>`;
    }).join('');

    updateResultCount(dealers.length);
  }

  function highlightCard(index) {
    document.querySelectorAll('.dealer-card').forEach(c => c.classList.remove('active'));
    const card = document.querySelector(`.dealer-card[data-index="${index}"]`);
    if (card) {
      card.classList.add('active');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    activeCardIndex = index;
  }

  function updateResultCount(count) {
    const el = document.getElementById('resultCount');
    const resetBtn = document.getElementById('resetBtn');
    if (filteredDealers.length !== allDealers.length) {
      el.textContent = `Showing ${count} dealer${count !== 1 ? 's' : ''}`;
      resetBtn.style.display = 'inline';
    } else {
      el.textContent = `${count} dealer${count !== 1 ? 's' : ''} total`;
      resetBtn.style.display = 'none';
    }
  }

  // ── Search & Distance ───────────────────────────────────────────────
  function haversineDistance(lat1, lng1, lat2, lng2) {
    const R = 3958.8; // Earth radius in miles
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  async function doSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const radius = parseInt(document.getElementById('radiusSelect').value);

    if (!query) {
      resetSearch();
      return;
    }

    // Geocode the search query using Nominatim
    const result = await geocodeAddress(query);

    if (!result) {
      // Fallback: text search on name/city/state/zip
      const q = query.toLowerCase();
      filteredDealers = allDealers.filter(d =>
        d.name.toLowerCase().includes(q) ||
        d.city.toLowerCase().includes(q) ||
        d.state.toLowerCase().includes(q) ||
        d.zip.includes(q)
      );
      filteredDealers.forEach(d => { d._distance = null; });
      renderList(filteredDealers);
      placeMarkers(filteredDealers);
      fitBounds(filteredDealers);
      return;
    }

    const searchLat = result.lat;
    const searchLng = result.lng;

    // Calculate distances
    allDealers.forEach(d => {
      if (d.lat && d.lng && !isNaN(d.lat) && !isNaN(d.lng)) {
        d._distance = haversineDistance(searchLat, searchLng, d.lat, d.lng);
      } else {
        d._distance = Infinity;
      }
    });

    // Filter by radius
    if (radius > 0) {
      filteredDealers = allDealers
        .filter(d => d._distance <= radius)
        .sort((a, b) => a._distance - b._distance);
    } else {
      filteredDealers = [...allDealers].sort((a, b) => (a._distance || Infinity) - (b._distance || Infinity));
    }

    renderList(filteredDealers);
    placeMarkers(filteredDealers);

    if (filteredDealers.length) {
      fitBounds(filteredDealers);
    } else {
      map.setView([searchLat, searchLng], 8);
    }
  }

  function resetSearch() {
    document.getElementById('searchInput').value = '';
    allDealers.forEach(d => { d._distance = null; });
    filteredDealers = [...allDealers];
    renderList(filteredDealers);
    placeMarkers(filteredDealers);
    fitBounds(filteredDealers);
  }

  // ── Public API (for onclick handlers) ───────────────────────────────
  window.__locator = {
    selectDealer(index) {
      const dealer = filteredDealers[index];
      if (!dealer) return;
      highlightCard(index);
      if (dealer.lat && dealer.lng && markers[index]) {
        map.setView([dealer.lat, dealer.lng], 12);
        markers[index].openPopup();
      }
    }
  };

  // ── Init ────────────────────────────────────────────────────────────
  function init() {
    map = L.map('map', {
      center: CONFIG.DEFAULT_CENTER,
      zoom: CONFIG.DEFAULT_ZOOM,
      zoomControl: true,
      attributionControl: true,
    });

    // OpenStreetMap tiles (free, no API key)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(map);

    markerGroup = L.layerGroup().addTo(map);

    // Event listeners
    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
    document.getElementById('resetBtn').addEventListener('click', resetSearch);

    loadDealers();
  }

  // Start when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
